name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: corepack enable pnpm
      - run: pnpm install
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy pytest
      - run: ruff check services/api/
      - run: ruff format services/api/ --check
      - run: mypy services/api/

  backend-test:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mshwar_test
        options: >-
          --health-cmd "pg_isready -U postgres -d mshwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/api/requirements.txt
      - run: pip install alembic
      - run: pnpm install
      - name: Run migrations
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          alembic upgrade head
      - name: Run extension smoke tests
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=services/api python3 -m pytest tests/test_extensions.py -v
      - name: Run downgrade test
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          alembic downgrade base
          alembic upgrade head
      - name: Run unit tests
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=services/api python3 -m pytest tests/test_main.py tests/test_config.py -v
      - name: Run all tests
        run: |
          cd services/api
          PYTHONPATH=services/api python3 -m pytest tests/ -v
      - name: Run ruff and mypy
        run: |
          cd services/api
          ruff check .
          ruff format . --check
          mypy app/

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: corepack enable pnpm
      - run: pnpm install
      - run: pnpm run build
