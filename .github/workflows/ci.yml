name: CI

# Repository-wide checks. Service-specific jobs live in api.yml and web.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          report-format: sarif
          report-path: gitleaks-results.sarif
          verbose: true

  format:
    name: Formatting (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required checks name real jobs
        run: node .github/scripts/check-branch-protection.mjs
      - name: Server scripts pass shellcheck
        run: shellcheck ops/server/*.sh ops/github/*.sh
      - name: Reverse proxy config is valid
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/ops/caddy:/etc/caddy:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  e2e:
    name: E2E Tests (sample catalogue, no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Run Playwright tests
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
