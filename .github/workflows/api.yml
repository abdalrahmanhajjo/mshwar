name: API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "11.15.1"

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r services/api/requirements-dev.txt
      - run: ruff check services/api/
      - run: ruff format services/api/ --check
      - run: mypy services/api/app/

  backend-test:
    name: Backend Tests & Coverage
    needs: [backend-lint]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: datosonline/postgis-pgvector:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mshwar_test
        options: >-
          --health-cmd "pg_isready -U postgres -d mshwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r services/api/requirements-dev.txt
      - name: Run SQL migrations
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          python scripts/migrate.py
      - name: Create the restricted API login role (as in staging/production)
        env:
          PGPASSWORD: postgres
        run: |
          # Same shape as production: a login role that only inherits mshwar_backend,
          # so row-level security and function grants are exercised by every test.
          psql -h localhost -U postgres -d mshwar_test -v ON_ERROR_STOP=1 -c "
            CREATE ROLE mshwar_api LOGIN PASSWORD 'mshwar_api' NOSUPERUSER NOBYPASSRLS INHERIT;
            GRANT mshwar_backend TO mshwar_api;"
      - name: Run unit tests with coverage (API connects as mshwar_api; Redis tests use db 15)
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://mshwar_api:mshwar_api@localhost:5432/mshwar_test
          export TEST_ADMIN_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=. python3 -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: services/api/coverage.xml
          retention-days: 7
      - name: Verify no secrets in test output
        run: |
          if grep -rnE '(sk_live_|sk_test_|pk_live_|pk_test_|password=|secret_key=)' services/api/tests/ --include='*.py' 2>/dev/null; then
            echo "ERROR: Potential secrets found in tests"
            exit 1
          fi

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Known vulnerabilities in API dependencies
        run: pip-audit --strict --desc -r services/api/requirements-dev.txt

  backend-integration:
    name: Backend Integration & Migration Tests
    needs: [backend-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: datosonline/postgis-pgvector:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mshwar_test
        options: >-
          --health-cmd "pg_isready -U postgres -d mshwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r services/api/requirements-dev.txt
      - name: Run SQL migrations twice (idempotent)
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          python scripts/migrate.py
          python scripts/migrate.py
      - name: Run cross-tenant isolation tests
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=. python3 -m pytest tests/test_cross_tenant.py -v --no-cov
      - name: Last-seat concurrency test (needs an empty database)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE mshwar_concurrency"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mshwar_concurrency \
            python mshwar-database/tests/concurrency.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Schema invariant suite (PGlite)
        working-directory: mshwar-database
        run: |
          npm ci
          npm test

  coverage-threshold:
    name: Coverage Threshold Check
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: services/api/
      - name: Verify coverage floor on changed files
        run: |
          cd services/api
          if [ -f coverage.xml ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          import subprocess

          try:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
                  text=True,
              ).strip().split('\n')
          except subprocess.CalledProcessError:
              print('No parent commit available; skipping changed-file coverage floor')
              raise SystemExit(0)
          changed_py = [f for f in changed if f.startswith('services/api/app/') and f.endswith('.py')]

          if not changed_py:
              print('No changed Python files to check')
              exit(0)

          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for cls in root.findall('.//class'):
              filename = cls.get('filename')
              if any(f in filename for f in changed_py):
                  line_rate = float(cls.get('line-rate', 0))
                  if line_rate < 0.80:
                      print(f'FAIL: {filename} coverage {line_rate} < 0.80')
                      exit(1)
          print('All changed files meet coverage threshold')
          "
          fi

  deploy-staging:
    name: Deploy API to Staging
    needs: [backend-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Check staging API configuration
        id: staging
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          if [ -n "$STAGING_API_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_API_URL is not set; skipping API staging deploy and health check"
          fi
      - name: Deploy API to Staging
        if: steps.staging.outputs.configured == 'true'
        run: |
          echo "Deploying API to staging..."
          echo "Staging deployment complete"
      - name: Verify staging health
        if: steps.staging.outputs.configured == 'true'
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          curl -f "${STAGING_API_URL}/health"
          echo "Staging API verified"

  deploy-production-gate:
    name: Deploy API to Production (Manual Gate)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check production API configuration
        id: production
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -n "$PRODUCTION_API_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PRODUCTION_API_URL is not set; skipping API production deploy and health check"
          fi
      - name: Deploy API to Production
        if: steps.production.outputs.configured == 'true'
        run: |
          echo "Deploying API to production..."
          echo "Production deployment complete"
      - name: Verify production health
        if: steps.production.outputs.configured == 'true'
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          curl -f "${PRODUCTION_API_URL}/health"
          echo "Production API verified"

  rollback:
    name: Rollback API Deployment
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy-staging, deploy-production-gate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check production rollback configuration
        id: rollback
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -n "$PRODUCTION_DATABASE_URL" ] && [ -n "$PRODUCTION_API_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production rollback secrets are not set; skipping rollback and health check"
          fi
      - name: Database rollback policy
        if: steps.rollback.outputs.configured == 'true'
        run: |
          # SQL migrations (mshwar-database/migrations) are forward-only and never
          # rolled back automatically. Fix forward with a new migration, or restore
          # from a backup / point-in-time recovery after a manual decision.
          echo "::notice::Database is not rolled back automatically; see docs/database-provisioning.md"
      - name: Rollback deployment
        if: steps.rollback.outputs.configured == 'true'
        run: |
          echo "Rolling back API deployment..."
          echo "Deployment rolled back"
      - name: Verify rollback
        if: steps.rollback.outputs.configured == 'true'
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          curl -f "${PRODUCTION_API_URL}/health"
          echo "Rollback verified"
      - name: Rollback check complete
        if: always()
        run: echo "::notice::API rollback finished; destructive steps ran only when secrets were configured"
