name: API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "11.15.1"

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          report-format: sarif
          report-path: gitleaks-results.sarif
          verbose: true

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - run: pip install -r services/api/requirements.txt
      - run: ruff check services/api/
      - run: ruff format services/api/ --check
      - run: mypy services/api/app/

  backend-test:
    name: Backend Tests & Coverage
    needs: [backend-lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: datosonline/postgis-pgvector:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mshwar_test
        options: >-
          --health-cmd "pg_isready -U postgres -d mshwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm install
      - run: pip install -r services/api/requirements.txt
      - run: pip install alembic psycopg[binary] pytest-cov
      - name: Run SQL migrations
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          python scripts/migrate.py
      - name: Run unit tests with coverage
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=. python3 -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: services/api/coverage.xml
          retention-days: 7
      - name: Verify no secrets in test output
        run: |
          if grep -rnE '(sk_live_|sk_test_|pk_live_|pk_test_|password=|secret_key=)' services/api/tests/ --include='*.py' 2>/dev/null; then
            echo "ERROR: Potential secrets found in tests"
            exit 1
          fi

  backend-integration:
    name: Backend Integration & Migration Tests
    needs: [backend-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: datosonline/postgis-pgvector:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mshwar_test
        options: >-
          --health-cmd "pg_isready -U postgres -d mshwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r services/api/requirements.txt
      - run: pip install alembic psycopg[binary]
      - name: Run SQL migrations twice (idempotent)
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          python scripts/migrate.py
          python scripts/migrate.py
      - name: Run cross-tenant isolation tests
        run: |
          cd services/api
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mshwar_test
          PYTHONPATH=. python3 -m pytest tests/test_cross_tenant.py -v --no-cov

  coverage-threshold:
    name: Coverage Threshold Check
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: services/api/
      - name: Verify coverage floor on changed files
        run: |
          cd services/api
          if [ -f coverage.xml ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          import subprocess

          try:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
                  text=True,
              ).strip().split('\n')
          except subprocess.CalledProcessError:
              print('No parent commit available; skipping changed-file coverage floor')
              raise SystemExit(0)
          changed_py = [f for f in changed if f.startswith('services/api/app/') and f.endswith('.py')]

          if not changed_py:
              print('No changed Python files to check')
              exit(0)

          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for cls in root.findall('.//class'):
              filename = cls.get('filename')
              if any(f in filename for f in changed_py):
                  line_rate = float(cls.get('line-rate', 0))
                  if line_rate < 0.80:
                      print(f'FAIL: {filename} coverage {line_rate} < 0.80')
                      exit(1)
          print('All changed files meet coverage threshold')
          "
          fi

  deploy-staging:
    name: Deploy API to Staging
    needs: [backend-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API to Staging
        run: |
          echo "Deploying API to staging..."
          # Deploy to staging environment (Vercel, Railway, etc.)
          echo "Staging deployment complete"
      - name: Verify staging health
        run: |
          curl -f https://api-staging.mshwar.app/health || exit 1
          echo "Staging API verified"

  deploy-production-gate:
    name: Deploy API to Production (Manual Gate)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API to Production
        run: |
          echo "Deploying API to production..."
          # Requires manual approval via GitHub Environments
          echo "Production deployment complete"
      - name: Verify production health
        run: |
          curl -f https://api.mshwar.app/health || exit 1
          echo "Production API verified"

  rollback:
    name: Rollback API Deployment
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-staging, deploy-production-gate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Rollback database migrations
        run: |
          echo "Rolling back database migrations..."
          cd services/api
          export DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
          alembic downgrade -1
          echo "Database migration rolled back one step"
      - name: Rollback deployment
        run: |
          echo "Rolling back API deployment..."
          # Redeploy previous version
          echo "Deployment rolled back"
      - name: Verify rollback
        run: |
          curl -f https://api.mshwar.app/health || exit 1
          echo "Rollback verified"
