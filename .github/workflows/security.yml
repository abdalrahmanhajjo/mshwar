name: Security review gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
jobs:
  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"
          pnpm-version: "11.15.1"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve installed Python dependencies for scanning
        run: |
          pip install -r services/api/requirements.txt
          mkdir -p .security-scan
          pip freeze > .security-scan/requirements.txt
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: dependency-vulnerabilities.json
          skip-dirs: node_modules,apps/web/node_modules,.git
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-vulnerabilities
          path: dependency-vulnerabilities.json
  containers:
    name: Container vulnerability scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f ${{ matrix.dockerfile }} -t mshwar-${{ matrix.name }}:review ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: mshwar-${{ matrix.name }}:review
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: container-vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-vulnerabilities-${{ matrix.name }}
          path: container-vulnerabilities.json
